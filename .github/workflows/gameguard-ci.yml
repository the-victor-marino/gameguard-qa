name: GameGuard QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} QA suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run GameGuard QA suite
        run: pytest --cov=game --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/results.xml

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameguard-qa-python-${{ matrix.python-version }}
          path: reports/
