name: GameGuard QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare reports
        run: mkdir -p reports

      - name: Run automated QA suite
        run: pytest --cov=game --cov=gameguard --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/results.xml

      - name: Run release quality gate
        run: python -m gameguard.quality_gate.gate | tee reports/quality-gate.txt

      - name: Generate build quality report
        run: python -m gameguard.reporting.report --output reports/quality-report.md

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameguard-qa-python-${{ matrix.python-version }}
          path: reports/
